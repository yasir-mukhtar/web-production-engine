  # ─────────────────────────────── Masryef ───────────────────────────────
  # Real-client prototype (site 4). English labels — this client's editors
  # work in English. Note: the spike's kopi-tiga (site 3) was never added
  # here; the topology friction (per-repo access leaks) is unresolved.
  - name: masryef
    label: "Masryef"
    type: group
    items:
      - name: site-masryef
        label: "Site settings"
        type: file
        path: sites/masryef/content/site.yml
        format: yaml
        fields:
          - name: name
            label: "Company name"
            description: "Exact legal name of the firm."
            type: string
            required: true
          - name: tagline
            label: "Tagline"
            description: "Short phrase shown next to the logo."
            type: string
          - name: logo
            label: "Logo"
            description: "Logo image. Best under 500 KB."
            type: image
            options:
              media: media-masryef
          - name: address
            label: "Address"
            description: "Full office address."
            type: object
            fields:
              - name: street
                label: "Street and number"
                description: "Example: Unit 17-7, Plaza 138, Jalan Ampang"
                type: string
                required: true
              - name: city
                label: "City"
                description: "Example: Kuala Lumpur"
                type: string
                required: true
              - name: province
                label: "State / territory"
                description: "Example: Wilayah Persekutuan"
                type: string
                required: true
              - name: postal_code
                label: "Postal code"
                description: "Example: 50450"
                type: string
          - name: geo
            label: "Map coordinates"
            description: "Office location for search results. Example: 3.1595, 101.7170"
            type: object
            fields:
              - name: lat
                label: "Latitude"
                description: "Latitude of the office."
                type: number
              - name: lng
                label: "Longitude"
                description: "Longitude of the office."
                type: number
          - name: hours
            label: "Opening hours"
            description: "Example: Mon–Fri: 9.00–18.00"
            type: string
          - name: phone
            label: "Phone"
            description: "Office phone with country code. Example: +60 3 2697 2692"
            type: string
          - name: socials
            label: "Social media"
            description: "Optional links. Leave blank if not used."
            type: object
            fields:
              - name: instagram
                label: "Instagram"
                type: string
              - name: facebook
                label: "Facebook"
                type: string
              - name: tiktok
                label: "TikTok"
                type: string
              - name: linkedin
                label: "LinkedIn"
                type: string
          - name: contact
            label: "Contact"
            description: "WhatsApp details used across the site."
            type: object
            fields:
              - name: whatsapp_number
                label: "WhatsApp number (E.164)"
                description: "Digits only, no +, no leading zero. Example: 60326972692"
                type: string
                required: true
              - name: whatsapp_default_message
                label: "Default WhatsApp message"
                description: "Pre-filled message when a visitor clicks the WhatsApp button."
                type: string
          - name: seo
            label: "SEO"
            description: "Search engine and social sharing settings."
            type: object
            fields:
              - name: title_template
                label: "Title template"
                description: "Page title pattern. {page} is replaced with the page name."
                type: string
                required: true
