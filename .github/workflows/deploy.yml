name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Path filtering: a change to one site rebuilds only that site; a change
  # to packages/core (or the lockfile/workflow) rebuilds both. This is what
  # makes canary-first fan-out possible in Phase 8.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      senyum-sehat: ${{ steps.filter.outputs.senyum-sehat }}
      baja-nusantara: ${{ steps.filter.outputs.baja-nusantara }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            senyum-sehat:
              - 'sites/senyum-sehat/**'
            baja-nusantara:
              - 'sites/baja-nusantara/**'

  build:
    name: Build & deploy ${{ matrix.site }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [senyum-sehat, baja-nusantara]
    # Coarse gate: matrix and secrets are not available in job-level if, so
    # this runs whenever ANYTHING relevant changed; the per-step fine gate
    # below decides which matrix cell actually does work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs['senyum-sehat'] == 'true' ||
      needs.changes.outputs['baja-nusantara'] == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version intentionally omitted: reads pnpm@9.15.9 from package.json
        # packageManager (declaring both causes ERR_PNPM_BAD_PM_VERSION)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fine gate: this matrix cell builds only if its own site or core
      # changed (step-level if may use matrix and needs).
      - name: Build site
        if: >-
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.core == 'true' ||
          needs.changes.outputs[matrix.site] == 'true'
        run: pnpm --filter @wps/${{ matrix.site }} build

      - name: Verify core classes reached output CSS
        if: >-
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.core == 'true' ||
          needs.changes.outputs[matrix.site] == 'true'
        run: grep -rl "bg-primary" sites/${{ matrix.site }}/dist/

      # Guarded so CI stays green until the human adds the secret in
      # pre-flight; the moment CLOUDFLARE_API_TOKEN exists, deploys activate.
      # secrets can't be read in `if` directly, so it arrives via env.
      - name: Deploy to Cloudflare Workers Static Assets
        if: >-
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.outputs.core == 'true' ||
           needs.changes.outputs[matrix.site] == 'true') &&
          env.HAS_CF_TOKEN == 'true'
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          workingDirectory: sites/${{ matrix.site }}
